# ==============================================================================
# KAIO Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Place or symlink in /etc/nginx/sites-available/kaio and enable via
# ln -s /etc/nginx/sites-available/kaio /etc/nginx/sites-enabled/
# ==============================================================================

upstream kaio_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace '_' with your domain name (e.g. kaio.yourdomain.com)

    # Global upload size limit (allows uploading meeting recordings & assets)
    client_max_body_size 500M;
    client_body_buffer_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API Proxy
    location / {
        proxy_pass http://kaio_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running processes & meeting pipeline streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering settings
        proxy_buffering off;
    }

    # Health check endpoint route
    location /health {
        proxy_pass http://kaio_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

